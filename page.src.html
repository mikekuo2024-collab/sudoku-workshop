<title>數獨工坊</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: drafting-table workbench — the board is the sheet, the side rail holds instruments (level, clock, pad, generator readout). */
:root {
  --paper: #eef1ec;        /* page ground, faint green-grey drafting paper */
  --sheet: #fbfcf9;        /* board cells */
  --ink: #1d2826;          /* digits, text */
  --ink-soft: #5b6a66;     /* secondary text */
  --rule: #b9c3bd;         /* thin cell lines */
  --rule-bold: #1d2826;    /* box lines */
  --accent: #2f4bd8;       /* cobalt: your entries, selection */
  --accent-wash: #dfe5ff;
  --peer: #e4e9e3;         /* same row/col/box */
  --same: #c9d3fb;         /* identical digit */
  --bad: #c2362b;
  --bad-wash: #f8dcd8;
  --good: #2e7d4f;
  --panel: #f6f8f4;
  --line: #d3dad5;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #141a19; --sheet: #1c2422; --ink: #e6ece8; --ink-soft: #95a39e;
    --rule: #34403c; --rule-bold: #8d9b96; --accent: #8fa2ff; --accent-wash: #253060;
    --peer: #222c2a; --same: #2f3a6e; --bad: #ff7b6e; --bad-wash: #4a2421; --good: #6fd39a;
    --panel: #1a211f; --line: #2c3633; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #141a19; --sheet: #1c2422; --ink: #e6ece8; --ink-soft: #95a39e;
  --rule: #34403c; --rule-bold: #8d9b96; --accent: #8fa2ff; --accent-wash: #253060;
  --peer: #222c2a; --same: #2f3a6e; --bad: #ff7b6e; --bad-wash: #4a2421; --good: #6fd39a;
  --panel: #1a211f; --line: #2c3633; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 1040px; margin: 0 auto; display: grid; gap: 20px; }
header.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 20px; }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(28px, 5vw, 40px); letter-spacing: -0.02em; margin: 0; line-height: 1; }
h1 small { font-family: var(--mono); font-weight: 400; font-size: 12px; letter-spacing: 0.04em; color: var(--ink-soft); margin-left: 10px; vertical-align: middle; }
.levels { display: flex; flex-wrap: wrap; gap: 4px; padding: 3px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
.levels button { border: 0; background: none; padding: 6px 12px; border-radius: 7px; cursor: pointer; font-weight: 500; color: var(--ink-soft); }
.levels button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.levels button:hover:not([aria-pressed="true"]) { color: var(--ink); }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 28px; align-items: start; }
@media (max-width: 820px) { .main { grid-template-columns: minmax(0, 1fr); } }

/* Board */
.board-col { display: grid; gap: 12px; justify-items: center; min-width: 0; }
.status { width: 100%; max-width: 560px; display: flex; justify-content: space-between; align-items: center; gap: 12px; font-family: var(--mono); font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.status b { color: var(--ink); font-weight: 500; }
.clock { font-family: var(--display); font-weight: 700; font-size: 22px; color: var(--ink); letter-spacing: 0.01em; }
.pause { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 2px 10px; cursor: pointer; font-family: var(--mono); font-size: 12px; }
.board-shell { position: relative; width: 100%; max-width: 560px; container-type: inline-size; }
/* One 9×9 grid: every row shares the same column tracks, so thin and thick lines line up across boxes. */
.board { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); grid-template-rows: repeat(9, minmax(0, 1fr)); background: var(--sheet); border: 3px solid var(--rule-bold); border-radius: 6px; aspect-ratio: 1; max-width: 100%; overflow: hidden; user-select: none; -webkit-user-select: none; }
.cell { border: 0 solid var(--rule); border-right-width: 1px; border-bottom-width: 1px; }
.cell:nth-child(3n) { border-right: 3px solid var(--rule-bold); }
.cell:nth-child(9n) { border-right: 0; }
.cell:nth-child(n+19):nth-child(-n+27), .cell:nth-child(n+46):nth-child(-n+54) { border-bottom: 3px solid var(--rule-bold); }
.cell:nth-child(n+73) { border-bottom: 0; }
.cell { position: relative; padding: 0; background: var(--sheet); cursor: pointer; display: grid; place-items: center; font-family: var(--display); font-weight: 500; font-size: 6.4cqi; line-height: 1; color: var(--accent); transition: background-color .12s; }
.cell.given { color: var(--ink); font-weight: 700; }
.cell.peer { background: var(--peer); }
.cell.same { background: var(--same); }
.cell.sel { background: var(--accent-wash); box-shadow: inset 0 0 0 2px var(--accent); }
.cell.wrong { color: var(--bad); background: var(--bad-wash); }
.cell.sel.wrong { box-shadow: inset 0 0 0 2px var(--bad); }
.cell.hinted::after { content: ""; position: absolute; top: 4px; right: 4px; width: 5px; height: 5px; border-radius: 50%; background: var(--good); }
.cell.flash { animation: flash .5s ease-out; }
@keyframes flash { from { background: var(--same); } }
.notes { position: absolute; inset: 6%; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); font-family: var(--mono); font-size: 2.2cqi; color: var(--ink-soft); font-weight: 500; }
.notes span { display: grid; place-items: center; }
.notes span.hl { color: var(--accent); font-weight: 600; }
.veil { position: absolute; inset: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--paper) 86%, transparent); backdrop-filter: blur(6px); border-radius: 6px; text-align: center; padding: 24px; }
.veil-card { display: grid; gap: 12px; justify-items: center; max-width: 340px; }
.veil h2 { font-family: var(--display); font-weight: 800; font-size: 34px; margin: 0; letter-spacing: -0.02em; text-wrap: balance; }
.veil p { margin: 0; color: var(--ink-soft); }
.veil .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Rail */
.rail { display: grid; gap: 16px; min-width: 0; }
.tools { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.tool { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 8px 4px 6px; cursor: pointer; display: grid; justify-items: center; gap: 2px; font-size: 12px; color: var(--ink-soft); position: relative; }
.tool svg { width: 22px; height: 22px; stroke: var(--ink); fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.tool:hover { border-color: var(--rule-bold); }
.tool[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.tool[aria-pressed="true"] svg { stroke: var(--paper); }
.tool:disabled { opacity: .45; cursor: default; }
.tool .badge { position: absolute; top: 4px; right: 6px; font-family: var(--mono); font-size: 10px; }
.pad { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 5px; }
.pad button { min-width: 0; border: 1px solid var(--line); background: var(--sheet); border-radius: 10px; cursor: pointer; display: grid; place-items: center; padding: 6px 0 4px; aspect-ratio: .78; gap: 0; }
@media (min-width: 821px) { .pad { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; } .pad button { aspect-ratio: 1.35; } }
.pad button:hover { border-color: var(--accent); }
.pad .d { font-family: var(--display); font-weight: 700; font-size: clamp(20px, 5.4vw, 28px); line-height: 1; color: var(--accent); }
.pad .left { font-family: var(--mono); font-size: 10px; color: var(--ink-soft); }
.pad button.done { visibility: hidden; }
.pad.noting .d { color: var(--ink-soft); font-weight: 500; }

.card { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); padding: 14px 16px; display: grid; gap: 10px; }
.card h3 { margin: 0; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft); font-weight: 600; }
.formula { font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; display: grid; gap: 2px; }
.formula .big { font-family: var(--display); font-weight: 800; font-size: 36px; line-height: 1; color: var(--ink); letter-spacing: -0.01em; }
.formula .big span { font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--ink-soft); margin-left: 6px; letter-spacing: 0; }
.scale { position: relative; height: 26px; }
.scale .bands { position: absolute; left: 0; right: 0; top: 4px; height: 8px; display: grid; grid-template-columns: 4fr 3fr 3fr 6fr; gap: 2px; }
.scale .bands i { border-radius: 2px; background: var(--line); }
.scale .bands i.on { background: var(--accent); }
.scale .mark { position: absolute; top: 0; width: 2px; height: 16px; background: var(--ink); transform: translateX(-1px); transition: left .3s; }
.scale .ticks { position: absolute; left: 0; right: 0; top: 14px; font-family: var(--mono); font-size: 10px; color: var(--ink-soft); }
.scale .ticks span { position: absolute; transform: translateX(-50%); }
dl.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; font-size: 13px; }
dl.kv dt { color: var(--ink-soft); }
dl.kv dd { margin: 0; text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.btn { border: 1px solid var(--ink); background: var(--ink); color: var(--paper); border-radius: 9px; padding: 8px 14px; cursor: pointer; font-weight: 600; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn:hover { filter: brightness(1.1); }
details.card summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; }
details.card summary::-webkit-details-marker { display: none; }
details.card summary::after { content: "+"; font-family: var(--mono); color: var(--ink-soft); }
details.card[open] summary::after { content: "−"; }
.opt { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; }
.opt input { width: 18px; height: 18px; accent-color: var(--accent); }
table.stats { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
table.stats th { text-align: left; font-weight: 500; color: var(--ink-soft); font-size: 11px; letter-spacing: .06em; padding: 0 0 6px; }
table.stats td { padding: 5px 0; border-top: 1px solid var(--line); font-family: var(--mono); }
table.stats td:first-child { font-family: var(--body); }
table.stats th:not(:first-child), table.stats td:not(:first-child) { text-align: right; }
.keys { font-size: 12px; color: var(--ink-soft); line-height: 1.7; }
kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--sheet); color: var(--ink); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 8px 14px; border-radius: 9px; font-size: 14px; pointer-events: none; opacity: 0; transition: opacity .2s; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <h1>數獨工坊<small>分岔指數出題器</small></h1>
    <nav class="levels" id="levels" aria-label="難度">
      <button data-level="easy">簡單</button>
      <button data-level="medium">中等</button>
      <button data-level="hard">困難</button>
      <button data-level="expert">專家</button>
      <button data-level="daily">每日挑戰</button>
    </nav>
  </header>

  <div class="main">
    <section class="board-col">
      <div class="status">
        <span>錯誤 <b id="mistakes">0</b><span id="mistakeCap">/3</span></span>
        <span class="clock" id="clock">00:00</span>
        <button class="pause" id="pauseBtn" aria-label="暫停">暫停</button>
      </div>
      <div class="board-shell">
        <div class="board" id="board" role="grid" aria-label="數獨盤面"></div>
        <div class="veil" id="veil" hidden><div class="veil-card" id="veilCard"></div></div>
      </div>
    </section>

    <aside class="rail">
      <div class="tools">
        <button class="tool" id="undoBtn" title="復原 (Z)"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>復原</button>
        <button class="tool" id="eraseBtn" title="清除 (Backspace)"><svg viewBox="0 0 24 24"><path d="m7 21-4.3-4.3a1 1 0 0 1 0-1.4l10-10a1 1 0 0 1 1.4 0l5.6 5.6a1 1 0 0 1 0 1.4L11 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>清除</button>
        <button class="tool" id="noteBtn" aria-pressed="false" title="筆記 (N)"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>筆記</button>
        <button class="tool" id="hintBtn" title="提示 (H)"><span class="badge" id="hintLeft">3</span><svg viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2Z"/></svg>提示</button>
      </div>
      <div class="pad" id="pad"></div>

      <section class="card" aria-labelledby="genH">
        <h3 id="genH">出題報告</h3>
        <div class="formula">
          <div class="big" id="fIndex">—<span></span></div>
          <div id="fExpr">難度指數 = 分岔 × 100 + 空格</div>
        </div>
        <div class="scale" aria-hidden="true">
          <div class="bands"><i></i><i></i><i></i><i></i></div>
          <div class="mark" id="scaleMark" style="left:0"></div>
          <div class="ticks"><span style="left:25%">400</span><span style="left:43.75%">700</span><span style="left:62.5%">1000</span><span style="left:100%;transform:translateX(-100%)">1600+</span></div>
        </div>
        <dl class="kv">
          <dt>提示數字</dt><dd id="kGiven">—</dd>
          <dt>唯一解・極小題</dt><dd id="kUnique">—</dd>
          <dt>嘗試次數</dt><dd id="kTries">—</dd>
          <dt>產生耗時</dt><dd id="kTime">—</dd>
          <dt>種子</dt><dd id="kSeed">—</dd>
        </dl>
      </section>

      <details class="card" id="settingsCard">
        <summary><h3>遊戲設定</h3></summary>
        <label class="opt" for="oCheck">自動檢查錯誤 <input type="checkbox" id="oCheck"></label>
        <label class="opt" for="oLimit">錯誤上限 3 次 <input type="checkbox" id="oLimit"></label>
        <label class="opt" for="oSame">高亮相同數字 <input type="checkbox" id="oSame"></label>
        <label class="opt" for="oArea">高亮行、列、宮 <input type="checkbox" id="oArea"></label>
        <label class="opt" for="oNotes">填數後自動清除筆記 <input type="checkbox" id="oNotes"></label>
        <label class="opt" for="oHide">隱藏已用完的數字 <input type="checkbox" id="oHide"></label>
        <div class="keys"><kbd>1</kbd>–<kbd>9</kbd> 填數　<kbd>←↑→↓</kbd> 移動　<kbd>N</kbd> 筆記　<kbd>Z</kbd> 復原　<kbd>H</kbd> 提示　<kbd>⌫</kbd> 清除　<kbd>空白</kbd> 暫停</div>
      </details>

      <details class="card" id="statsCard">
        <summary><h3>成績統計</h3></summary>
        <table class="stats" id="stats"></table>
        <button class="btn ghost" id="resetStats" type="button">清除統計</button>
      </details>
    </aside>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/*ENGINE*/
</script>
<script>
(function () {
  const E = window.SudokuEngine;
  const LEVEL_NAME = { easy: '簡單', medium: '中等', hard: '困難', expert: '專家' };
  const HINTS = 3, MISTAKE_LIMIT = 3;
  const $ = id => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem('sudoku-workshop:' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('sudoku-workshop:' + k, JSON.stringify(v)); } catch (e) {} },
  };
  const opts = Object.assign({ check: true, limit: true, same: true, area: true, notes: true, hide: true }, store.get('opts', {}));
  let G = null;          // current game
  let sel = 40, noteMode = false, history = [], timer = null, genToken = 0;

  // ---------- build DOM ----------
  const boardEl = $('board'), cells = new Array(81);
  for (let i = 0; i < 81; i++) {
    const c = document.createElement('button');
    c.className = 'cell'; c.type = 'button'; c.dataset.i = i; c.setAttribute('role', 'gridcell');
    c.addEventListener('click', () => { select(i); });
    cells[i] = c; boardEl.appendChild(c);
  }
  const padEl = $('pad'), padBtns = [];
  for (let d = 1; d <= 9; d++) {
    const b = document.createElement('button'); b.type = 'button';
    b.innerHTML = '<span class="d">' + d + '</span><span class="left"></span>';
    b.setAttribute('aria-label', '填入 ' + d);
    b.addEventListener('click', () => input(d));
    padBtns.push(b); padEl.appendChild(b);
  }

  // ---------- game lifecycle ----------
  function todayKey() { const d = new Date(); return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); }
  function dailyLevel(key) { const d = new Date(Math.floor(key / 10000), Math.floor(key / 100) % 100 - 1, key % 100); return E.LEVELS[d.getDay() % 4]; }

  function newGame(mode) {
    const token = ++genToken;
    const daily = mode === 'daily';
    const seed = daily ? todayKey() : (Math.random() * 2 ** 32) >>> 0;
    const level = daily ? dailyLevel(seed) : mode;
    stopClock();
    showVeil('<div class="spinner"></div><p>正在為你出一題' + LEVEL_NAME[level] + '…</p>');
    setLevelButtons(mode);
    setTimeout(() => {
      if (token !== genToken) return;
      const t0 = performance.now();
      const g = E.generateGame(level, seed);
      const ms = performance.now() - t0;
      G = {
        mode, level: g.level, seed, puzzle: g.puzzle, solution: g.solution, rating: g.rating,
        tries: g.tries, genMs: Math.round(ms), values: g.puzzle.slice(), notes: new Array(81).fill(0),
        wrong: new Array(81).fill(false), hinted: new Array(81).fill(false),
        mistakes: 0, hints: 0, time: 0, state: 'play', dailyKey: daily ? seed : null,
      };
      history = []; sel = firstEmpty();
      hideVeil(); render(); renderReport(); startClock(); save();
    }, 30);
  }
  function firstEmpty() { const i = G.values.indexOf(0); return i < 0 ? 0 : i; }

  function setLevelButtons(mode) {
    document.querySelectorAll('#levels button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.level === mode)));
  }

  // ---------- input ----------
  function select(i) { sel = i; if (G && G.state === 'play') render(); }
  function snapshot() { history.push({ values: G.values.slice(), notes: G.notes.slice(), wrong: G.wrong.slice() }); if (history.length > 300) history.shift(); }

  function input(d) {
    if (!G || G.state !== 'play') return;
    if (G.puzzle[sel] || G.hinted[sel]) return;
    if (noteMode) {
      if (G.values[sel]) return;
      snapshot();
      G.notes[sel] ^= 1 << d;
    } else {
      if (G.values[sel] === d) return;
      snapshot();
      G.values[sel] = d; G.notes[sel] = 0;
      const correct = G.solution[sel] === d;
      G.wrong[sel] = !correct;
      if (correct && opts.notes) clearPeerNotes(sel, d);
      if (!correct && opts.check) {
        G.mistakes++;
        if (opts.limit && G.mistakes >= MISTAKE_LIMIT) { render(); return lose(); }
      }
      if (correct) celebrateUnits(sel);
    }
    render(); save(); checkFull();
  }
  function clearPeerNotes(i, d) { for (const p of E.PEERS[i]) G.notes[p] &= ~(1 << d); }
  function erase() {
    if (!G || G.state !== 'play' || G.puzzle[sel] || G.hinted[sel]) return;
    if (!G.values[sel] && !G.notes[sel]) return;
    snapshot(); G.values[sel] = 0; G.notes[sel] = 0; G.wrong[sel] = false; render(); save();
  }
  function undo() {
    if (!G || G.state !== 'play' || !history.length) return;
    const h = history.pop(); G.values = h.values; G.notes = h.notes; G.wrong = h.wrong; render(); save();
  }
  function hint() {
    if (!G || G.state !== 'play') return;
    if (G.hints >= HINTS) return toast('這局的 3 次提示已用完');
    // Selected cell if it still needs a value, otherwise the most constrained empty cell (the same MRV pick the rater uses).
    let i = (!G.puzzle[sel] && G.values[sel] !== G.solution[sel]) ? sel : -1;
    if (i < 0) {
      let bestK = 10;
      for (let j = 0; j < 81; j++) {
        if (G.values[j] === G.solution[j]) continue;
        let k = 0; const g = G.values.map((v, x) => (G.wrong[x] ? 0 : v));
        for (let d = 1; d <= 9; d++) if (E.isSafe(g, j, d)) k++;
        if (k < bestK) { bestK = k; i = j; }
      }
    }
    if (i < 0) return;
    snapshot();
    G.values[i] = G.solution[i]; G.notes[i] = 0; G.wrong[i] = false; G.hinted[i] = true; G.hints++;
    if (opts.notes) clearPeerNotes(i, G.solution[i]);
    sel = i; render(); save(); checkFull();
  }

  function checkFull() {
    if (G.values.some(v => !v)) return;
    if (G.values.every((v, i) => v === G.solution[i])) return win();
    toast('盤面已填滿，但還有錯誤的格子');
    if (!opts.check) { for (let i = 0; i < 81; i++) G.wrong[i] = G.values[i] !== G.solution[i]; render(); }
  }

  // ---------- end states ----------
  function win() {
    G.state = 'won'; stopClock(); recordStat(true); save();
    showVeil('<h2>完成！</h2><p>' + LEVEL_NAME[G.level] + '・難度指數 ' + G.rating.index + '</p>' +
      '<dl class="kv" style="width:220px"><dt>用時</dt><dd>' + fmt(G.time) + '</dd><dt>錯誤</dt><dd>' + G.mistakes + '</dd><dt>提示</dt><dd>' + G.hints + '</dd></dl>' +
      '<div class="row"><button class="btn" data-act="again">再來一局' + LEVEL_NAME[G.level] + '</button></div>');
  }
  function lose() {
    G.state = 'lost'; stopClock(); recordStat(false); save();
    showVeil('<h2>錯了 3 次</h2><p>這局結束了。可以從頭重玩同一題，或換一題。</p>' +
      '<div class="row"><button class="btn" data-act="restart">重玩這題</button><button class="btn ghost" data-act="again">換一題</button></div>');
  }
  function restart() {
    G.values = G.puzzle.slice(); G.notes.fill(0); G.wrong.fill(false); G.hinted.fill(false);
    G.mistakes = 0; G.hints = 0; G.time = 0; G.state = 'play'; history = []; sel = firstEmpty();
    hideVeil(); render(); startClock(); save();
  }
  $('veilCard').addEventListener('click', e => {
    const a = e.target.closest('[data-act]'); if (!a) return;
    if (a.dataset.act === 'again') newGame(G.mode === 'daily' ? G.level : G.mode);
    if (a.dataset.act === 'restart') restart();
    if (a.dataset.act === 'resume') togglePause();
  });

  // ---------- clock ----------
  function fmt(s) { const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = s % 60; return (h ? h + ':' : '') + String(m).padStart(2, '0') + ':' + String(x).padStart(2, '0'); }
  function startClock() { stopClock(); timer = setInterval(() => { if (G && G.state === 'play' && !document.hidden) { G.time++; $('clock').textContent = fmt(G.time); if (G.time % 5 === 0) save(); } }, 1000); }
  function stopClock() { clearInterval(timer); timer = null; }
  function togglePause() {
    if (!G) return;
    if (G.state === 'play') { G.state = 'paused'; showVeil('<h2>已暫停</h2><p>' + fmt(G.time) + '</p><div class="row"><button class="btn" data-act="resume">繼續</button></div>'); }
    else if (G.state === 'paused') { G.state = 'play'; hideVeil(); render(); }
    $('pauseBtn').textContent = G.state === 'paused' ? '繼續' : '暫停';
  }

  // ---------- rendering ----------
  function render() {
    if (!G) return;
    const v = G.values, selVal = v[sel];
    const counts = new Array(10).fill(0);
    for (let i = 0; i < 81; i++) if (v[i] && !G.wrong[i]) counts[v[i]]++;
    const sr = Math.floor(sel / 9), sc = sel % 9, sb = Math.floor(sr / 3) * 3 + Math.floor(sc / 3);
    for (let i = 0; i < 81; i++) {
      const c = cells[i], r = Math.floor(i / 9), col = i % 9, b = Math.floor(r / 3) * 3 + Math.floor(col / 3);
      const isPeer = opts.area && i !== sel && (r === sr || col === sc || b === sb);
      const isSame = opts.same && selVal && v[i] === selVal && i !== sel;
      c.className = 'cell' + (G.puzzle[i] ? ' given' : '') + (isPeer ? ' peer' : '') + (isSame ? ' same' : '') +
        (i === sel ? ' sel' : '') + (G.wrong[i] && (opts.check || G.state !== 'play') ? ' wrong' : '') + (G.hinted[i] ? ' hinted' : '');
      if (v[i]) { if (c.textContent !== String(v[i]) || c.firstChild?.nodeType !== 3) c.textContent = v[i]; }
      else if (G.notes[i]) {
        let h = '<span class="notes">';
        for (let d = 1; d <= 9; d++) h += '<span' + (opts.same && selVal === d ? ' class="hl"' : '') + '>' + (G.notes[i] & (1 << d) ? d : '') + '</span>';
        c.innerHTML = h + '</span>';
      } else c.textContent = '';
      c.setAttribute('aria-label', '第' + (r + 1) + '列第' + (col + 1) + '行 ' + (v[i] || '空'));
    }
    padBtns.forEach((b, k) => {
      const left = 9 - counts[k + 1];
      b.querySelector('.left').textContent = left;
      b.classList.toggle('done', opts.hide && left <= 0);
    });
    padEl.classList.toggle('noting', noteMode);
    $('noteBtn').setAttribute('aria-pressed', String(noteMode));
    $('mistakes').textContent = G.mistakes;
    $('mistakeCap').textContent = opts.check && opts.limit ? '/' + MISTAKE_LIMIT : '';
    $('hintLeft').textContent = HINTS - G.hints;
    $('hintBtn').disabled = G.hints >= HINTS;
    $('undoBtn').disabled = !history.length;
    $('clock').textContent = fmt(G.time);
    $('pauseBtn').textContent = G.state === 'paused' ? '繼續' : '暫停';
  }
  function renderReport() {
    const r = G.rating;
    $('fIndex').innerHTML = r.index + '<span>' + LEVEL_NAME[G.level] + (G.mode === 'daily' ? '・每日' : '') + '</span>';
    $('fExpr').textContent = r.index + ' = 分岔 ' + r.branch + ' × 100 + 空格 ' + r.empty;
    $('kGiven').textContent = (81 - r.empty) + ' 個';
    $('kUnique').textContent = '是・是';
    $('kTries').textContent = G.tries + ' 題中選 1';
    $('kTime').textContent = G.genMs + ' ms';
    $('kSeed').textContent = G.seed;
    const pct = Math.min(r.index, 1600) / 1600 * 100;
    $('scaleMark').style.left = pct + '%';
    document.querySelectorAll('.scale .bands i').forEach((el, k) => el.classList.toggle('on', E.LEVELS[k] === G.level));
  }
  function celebrateUnits(i) {
    const r = Math.floor(i / 9), c = i % 9, b = Math.floor(r / 3) * 3 + Math.floor(c / 3);
    const units = [[...Array(9)].map((_, k) => r * 9 + k), [...Array(9)].map((_, k) => k * 9 + c),
      [...Array(9)].map((_, k) => (Math.floor(b / 3) * 3 + Math.floor(k / 3)) * 9 + (b % 3) * 3 + k % 3)];
    for (const u of units) if (u.every(j => G.values[j] === G.solution[j])) u.forEach(j => { cells[j].classList.remove('flash'); void cells[j].offsetWidth; cells[j].classList.add('flash'); });
  }
  function showVeil(html) { $('veilCard').innerHTML = html; $('veil').hidden = false; }
  function hideVeil() { $('veil').hidden = true; }
  let toastT; function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }

  // ---------- stats ----------
  function recordStat(won) {
    const s = store.get('stats', {}); const k = G.level; const e = s[k] || { played: 0, won: 0, best: null, total: 0 };
    e.played++; if (won) { e.won++; e.total += G.time; if (e.best == null || G.time < e.best) e.best = G.time; }
    s[k] = e; store.set('stats', s);
    if (won && G.dailyKey) { const d = store.get('daily', {}); d[G.dailyKey] = G.time; store.set('daily', d); }
    renderStats();
  }
  function renderStats() {
    const s = store.get('stats', {});
    let h = '<tr><th>難度</th><th>完成</th><th>最佳</th><th>平均</th></tr>';
    for (const k of E.LEVELS) { const e = s[k] || { played: 0, won: 0, best: null, total: 0 };
      h += '<tr><td>' + LEVEL_NAME[k] + '</td><td>' + e.won + '/' + e.played + '</td><td>' + (e.best == null ? '—' : fmt(e.best)) + '</td><td>' + (e.won ? fmt(Math.round(e.total / e.won)) : '—') + '</td></tr>'; }
    $('stats').innerHTML = h;
  }
  $('resetStats').addEventListener('click', e => {
    const b = e.currentTarget;
    if (b.dataset.armed) { store.set('stats', {}); renderStats(); b.textContent = '清除統計'; delete b.dataset.armed; toast('統計已清除'); }
    else { b.dataset.armed = '1'; b.textContent = '再按一次確認清除'; setTimeout(() => { if (b.dataset.armed) { delete b.dataset.armed; b.textContent = '清除統計'; } }, 3000); }
  });

  // ---------- persistence ----------
  function save() { if (G) store.set('game', { G, history: history.slice(-50) }); }
  function restore(data) {
    if (!data || !data.G || !data.G.solution) return false;
    G = data.G; history = data.history || [];
    if (G.state === 'paused') G.state = 'play';
    sel = firstEmpty(); setLevelButtons(G.mode); render(); renderReport();
    if (G.state === 'won') win(); else if (G.state === 'lost') lose(); else { hideVeil(); startClock(); }
    return true;
  }

  // ---------- settings ----------
  const optMap = { oCheck: 'check', oLimit: 'limit', oSame: 'same', oArea: 'area', oNotes: 'notes', oHide: 'hide' };
  for (const [id, k] of Object.entries(optMap)) {
    const el = $(id); el.checked = !!opts[k];
    el.addEventListener('change', () => { opts[k] = el.checked; store.set('opts', opts); render(); });
  }

  // ---------- wiring ----------
  document.querySelectorAll('#levels button').forEach(b => b.addEventListener('click', () => newGame(b.dataset.level)));
  $('undoBtn').addEventListener('click', undo);
  $('eraseBtn').addEventListener('click', erase);
  $('noteBtn').addEventListener('click', () => { noteMode = !noteMode; render(); });
  $('hintBtn').addEventListener('click', hint);
  $('pauseBtn').addEventListener('click', togglePause);
  document.addEventListener('keydown', e => {
    if (e.target.closest?.('input, select, textarea, summary')) return;
    if (e.metaKey || e.ctrlKey) { if (e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); } return; }
    const k = e.key;
    if (k === ' ') { e.preventDefault(); return togglePause(); }
    if (!G || G.state !== 'play') return;
    if (/^[1-9]$/.test(k)) { input(+k); return; }
    const mv = { ArrowUp: -9, ArrowDown: 9, ArrowLeft: -1, ArrowRight: 1 }[k];
    if (mv) { e.preventDefault(); let r = Math.floor(sel / 9), c = sel % 9;
      if (mv === -9) r = (r + 8) % 9; if (mv === 9) r = (r + 1) % 9; if (mv === -1) c = (c + 8) % 9; if (mv === 1) c = (c + 1) % 9;
      select(r * 9 + c); return; }
    if (k === 'Backspace' || k === 'Delete' || k === '0') { e.preventDefault(); erase(); }
    else if (k === 'n' || k === 'N') { noteMode = !noteMode; render(); }
    else if (k === 'z' || k === 'Z') undo();
    else if (k === 'h' || k === 'H') hint();
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

  function start(hot) {
    renderStats();
    if (!restore(hot && hot.G ? hot : store.get('game', null))) newGame('medium');
  }
  window.claude?.hot?.snapshot?.(() => ({ G, history }));
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
